*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:"GameUI","GameKR","Malgun Gothic","맑은 고딕",sans-serif;font-weight:600;color:var(--ink);font-size:20px;line-height:1.3;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#172330}
#mapclip{position:absolute;left:0;top:0;width:1920px;height:884px;overflow:hidden}
#mapmove,#under,#hl,#map{position:absolute;left:0;top:0;width:1920px;height:884px}
#under,#hl{overflow:visible}
#map{background:var(--cap) 0 0 no-repeat}
#hud{position:absolute;left:0;top:884px;width:1920px;height:196px;background:var(--cap) 0 -884px no-repeat}
#tray{position:absolute;left:115px;top:750px;display:block}
.toolsel{position:absolute;border:2px solid var(--accent);border-radius:8px;background:rgba(54,183,255,.16)}
.cur{position:absolute;width:26px;height:34px}
.tag{position:absolute;padding:6px 12px;border:1px dashed rgba(237,244,245,.6);border-radius:6px;background:rgba(20,43,55,.82);font-size:18px;line-height:24px;white-space:nowrap}
.tag b{color:var(--accent);margin-right:8px;font-weight:inherit}

.win{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.4);overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;height:60px;flex:none;padding:0 10px 0 20px;border-bottom:1px solid var(--line)}
.hd .ttl{font-size:24px;margin-right:auto}
.ib{width:40px;height:40px;flex:none;border-radius:8px;background:var(--line);display:grid;place-items:center}
.ib.sm{width:36px;height:36px}
.ib.off{opacity:.3}
.btn{height:42px;padding:0 16px;border-radius:8px;background:var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:20px;white-space:nowrap}
.btn.pri{background:var(--accent);color:#142b37}
.btn.wide{display:flex;width:100%}
.focus{outline:2px dotted var(--ink);outline-offset:3px}
.tab{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 14px;border-radius:8px;background:var(--row);border:1px solid transparent;font-size:20px;white-space:nowrap}
.tab.on{background:var(--sel);border-color:var(--accent)}
.tab.off{opacity:.45}
.tab .cnt{color:var(--dim);text-align:right}
.tab.on .cnt{color:var(--ink)}
.sec{font-size:18px;line-height:24px;color:var(--dim);margin:14px 0 6px}
.stop{display:flex;align-items:center;gap:8px;height:44px;padding:0 4px 0 8px;border-radius:8px;background:var(--row)}
.stop+.stop{margin-top:5px}
.stop.slot{background:transparent;border:1px dashed var(--line)}
.num{width:30px;height:30px;flex:none;border-radius:50%;background:var(--accent);color:#142b37;display:grid;place-items:center;font-size:18px;line-height:1}
.num.hol{background:transparent;border:2px dashed var(--accent);color:var(--accent)}
.sp{flex:1}
.srow{display:flex;align-items:center;gap:14px;height:40px}
.srow .lb{width:96px;flex:none;white-space:nowrap}
.srow .v{width:62px;flex:none;text-align:right;white-space:nowrap}
.sl{position:relative;flex:1;height:8px;border-radius:4px;background:#0c1c25}
.sl i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.sl b{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--ink);border:2px solid #142b37}
.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;height:34px;white-space:nowrap}
.kv .v{display:flex;align-items:center;justify-content:flex-end;gap:6px;text-align:right}
.sw{position:relative;width:52px;height:28px;flex:none;border-radius:14px;background:var(--line)}
.sw b{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--ink)}
.sw.on{background:var(--accent)}
.sw.on b{left:27px}
.need{position:relative;border:1px dashed rgba(237,244,245,.6);border-radius:8px;padding:8px 10px 2px;margin-top:18px}
.need .cap{position:absolute;right:10px;top:-13px;padding:0 8px;background:var(--panel);font-size:18px;line-height:24px;white-space:nowrap}
.warn{color:var(--warn);display:inline-flex;align-items:center;gap:6px}
.g2{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
.dt{display:flex;align-items:center;gap:12px;height:44px}
.dt .nm{font-size:26px;margin-right:auto;white-space:nowrap}
.lr{display:flex;align-items:center;gap:12px;height:48px;white-space:nowrap}
.lr .nm{font-size:22px;margin-right:auto}
.lr .st{font-size:18px;color:var(--dim)}
.lr .st.warn{color:var(--warn)}
.lr.c{padding:0 12px;border-radius:10px;background:var(--row);border:1px solid transparent}
.lr.c.on{background:var(--sel);border-color:var(--accent)}

/* A 큰 창 */
.A{left:24px;top:20px;width:1076px;height:852px;display:flex}
.A .nav{width:150px;flex:none;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px}
.A .main{flex:1;display:flex;flex-direction:column;min-width:0}
.A .body{flex:1;display:flex;min-height:0}
.A .list{width:450px;flex:none;border-right:1px solid var(--line);padding:8px 14px}
.lt{display:grid;grid-template-columns:1fr 56px 64px 88px 52px;align-items:center;column-gap:10px;padding:0 10px;white-space:nowrap}
.lt.h{height:40px;font-size:18px;color:var(--dim)}
.lt.r{height:54px;border-radius:8px;border:1px solid transparent;margin-bottom:4px}
.lt.r.on{background:var(--sel);border-color:var(--accent)}
.lt .n{text-align:right}
.A .detail{flex:1;padding:14px 20px;min-width:0}

/* B 오른쪽 패널 */
.B{left:1396px;top:20px;width:500px;height:718px;display:flex;flex-direction:column}
.B .hd{height:56px}
.kt{display:flex;gap:6px;padding:12px 16px;flex:none}
.kt .tab{flex:1;height:44px;padding:0 6px;justify-content:center;gap:8px}
.acc{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.grp{border:1px solid var(--accent);border-radius:10px;background:#17323f;padding:4px 12px 10px}
.grp .need .cap{background:#17323f}
.B .stop{height:42px}
.B .stop+.stop{margin-top:4px}
.B .srow{height:38px}
.B .kv{height:32px}

/* C 하단 노선 띠 */
.C{left:24px;top:596px;width:1872px;height:276px;display:flex}
.C .nav{width:150px;flex:none;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.C .nav .tab{height:48px}
.C .list{width:300px;flex:none;border-right:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.C .mid{flex:1;padding:10px 20px;min-width:0}
.C .side{width:470px;flex:none;border-left:1px solid var(--line);padding:12px 66px 10px 20px}
.C .kv{height:32px}
.C .xc{position:absolute;right:12px;top:12px}
.strip{position:relative;height:160px;margin-top:10px}
.strip .ln{position:absolute;top:27px;height:6px;border-radius:3px;background:var(--accent)}
.strip .dl{position:absolute;top:28px;border-top:4px dashed var(--line)}
.nd{position:absolute;top:0;width:156px;margin-left:-78px;display:flex;flex-direction:column;align-items:center;padding:8px 0 8px;border-radius:10px;border:1px solid transparent;white-space:nowrap}
.nd.on{background:var(--sel);border-color:var(--accent)}
.nd .num{width:44px;height:44px;font-size:22px;border:3px solid #142b37}
.nd .num.add{background:var(--panel);border:2px dashed var(--ink)}
.nd .lb{font-size:18px;line-height:24px;margin-top:4px}
.nd .ops{display:flex;gap:6px;margin-top:6px}
</style>
</head>
<body>
<div id="stage">
  <div id="mapclip"><div id="mapmove">

const NS = 'http://www.w3.org/2000/svg';
const hl = document.getElementById('hl');
const ui = document.getElementById('ui');

function svgEl(tag, attrs, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  hl.appendChild(e); return e;
}
function put(html){ ui.insertAdjacentHTML('beforeend', html); }

  right: `<svg width="14" height="20" viewBox="0 0 14 20"><path d="M12.5 10 1.5 1.5V18.5Z" fill="#e4eef1"/></svg>`,
  plus: (c='#e4eef1') => `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`,
  trash: `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M9 2h6l1 2h5v3H3V4h5zM5 9h14l-1 13H6z" fill="#e4eef1"/><path d="M9.3 12v7M12 12v7M14.7 12v7" stroke="#152d3b" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  warn: `<svg width="22" height="22" viewBox="0 0 30 30"><path d="M15 2.5 28.5 26.5H1.5Z" fill="#ffcf33" stroke="#ffcf33" stroke-width="2" stroke-linejoin="round"/><rect x="13.4" y="10" width="3.2" height="9.5" rx="1.4" fill="#142b37"/><circle cx="15" cy="22.6" r="1.9" fill="#142b37"/></svg>`
};
const KINDS = [['버스',2],['철도',2],['지하철',1],['화물',1]];
const LINES = [
  {nm:'철도 1', stops:3, head:gmin(60), st:'운행 중', sel:true},
  {nm:'철도 4', stops:2, head:gmin(100), st:'막힘', bad:true}
];
const tabs = (dim) => KINDS.map(([k,n]) => `<span class="tab${k==='철도'?' on':(dim?' off':'')}"><span>${k}</span><span class="cnt">${n}</span></span>`).join('');
const stText = l => l.bad ? `<span class="warn">${IC.warn}${l.st}</span>` : l.st;
const badge = n => `<span class="num">${n}</span>`;
const kv = (k, v) => `<div class="kv"><span>${k}</span><span class="v">${v}</span></div>`;
const sw = on => `<span class="sw${on?' on':''}"><b></b></span>`;
const slider = o => `<span class="sl"><i style="width:${pct(o)}%"></i><b style="left:${pct(o)}%"></b></span>`;
const sliders = () =>
  `<div class="srow"><span class="lb">배차 간격</span>${slider(HEAD)}<span class="v">${gmin(HEAD.sec)}분</span></div>` +
  `<div class="srow"><span class="lb">정차 시간</span>${slider(DWELL)}<span class="v">${gmin(DWELL.sec)}분</span></div>`;
const stopRow = (n, total, small) => `<div class="stop">${badge(n)}<span>기차역</span><span class="sp"></span>` +
  `<span class="ib sm${n===1?' off':''}">${IC.up}</span><span class="ib sm${n===total?' off':''}">${IC.down}</span><span class="ib sm">${IC.x(18)}</span></div>`;
const stopRows = () => [1,2,3].map(n => stopRow(n, 3)).join('');
const stats = () => kv('상태','운행 중') + kv('출발','1회') + kv('다음 정류장', badge(1)) + kv('길이','1,013 m');
const need = (cls='') => `<div class="need ${cls}"><span class="cap">새 데이터 필요</span>${kv('대기 승객','—')}${kv('탑승 인원','—')}</div>`;

/* ───── 지도 위 강조 ───── */
const STOP_XY = [GEO.stops['280'], GEO.stops['200'], GEO.stops['120']];   // 운행 방향 순서 ① ② ③
function marker(p, n, hollow){
  svgEl('circle', {cx:p[0], cy:p[1], r:18, fill: hollow ? 'rgba(20,43,55,.88)' : '#36b7ff', stroke: hollow ? '#36b7ff' : '#142b37', 'stroke-width':3, 'stroke-dasharray': hollow ? '6 4' : 'none'});
  svgEl('text', {x:p[0], y:p[1] + 1, 'text-anchor':'middle', 'dominant-baseline':'central', 'font-size':20, fill: hollow ? '#36b7ff' : '#142b37'}, n);
}
function cursor(x, y){
  const e = document.createElement('div'); e.className = 'cur';
  e.style.left = (x - 1) + 'px'; e.style.top = (y - 1) + 'px';
  e.innerHTML = '<svg width="26" height="34" viewBox="0 0 26 34"><path d="M1.5 1.5 L1.5 26 L8 20 L12.3 30.5 L16.6 28.7 L12.4 18.6 L21 18.6 Z" fill="#ffffff" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>';
  stage.appendChild(e);
}
if (SCN === 1){
  svgEl('path', {d:GEO.path, fill:'none', stroke:'#142b37', 'stroke-opacity':.9, 'stroke-width':11, 'stroke-linejoin':'round'});
  svgEl('path', {d:GEO.path, fill:'none', stroke:'#36b7ff', 'stroke-width':6, 'stroke-linejoin':'round'});
  STOP_XY.forEach((p, i) => marker(p, i + 1, false));
} else {
  /* 고르는 중에는 경로 선을 그리지 않는다. 경로는 완료할 때 계산·검증된다(transit_line_tool.gd draw_preview). 번호 원만 둔다. */
  marker(STOP_XY[0], 1, false); marker(STOP_XY[1], 2, false); marker(STOP_XY[2], 3, true);
  cursor(STOP_XY[2][0] + SHIFT[0] + 12, STOP_XY[2][1] + SHIFT[1] + 10);
}

/* ───── B: 실제 교통 트레이 + '노선' 도구 선택 표시 ───── */
if (VAR === 'B'){
  put(`<img id="tray" src="${TRAY_SRC}" alt="">`);
  put(`<div class="toolsel" style="left:${TOOL[0]}px;top:${TOOL[1]}px;width:${TOOL[2]}px;height:${TOOL[3]}px"></div>`);
}

/* ───── 창 ───── */
if (SCN === 1 && VAR === 'A'){
  const row = l => `<div class="lt r${l.sel?' on':''}"><span>${l.nm}</span><span class="n">${l.stops}곳</span><span class="n">${l.head}분</span><span>${stText(l)}</span>${sw(true)}</div>`;
  put(`<div class="win A">
    <div class="nav">${tabs()}</div>
    <div class="main">
      <div class="hd"><span class="ttl">노선</span><span class="ib">${IC.x(20)}</span></div>
      <div class="body">
        <div class="list">
          <div class="lt h"><span>노선</span><span class="n">정류장</span><span class="n">배차</span><span>상태</span><span>운행</span></div>
          ${LINES.map(row).join('')}
          <div class="btn wide" style="margin-top:8px">${IC.plus()}새 노선</div>
        </div>
        <div class="detail">
          <div class="dt"><span class="nm">철도 1</span><span class="btn">${IC.trash}노선 삭제</span></div>
          <div class="sec">정류장</div>
          ${stopRows()}
          <div class="btn wide focus" style="margin-top:8px">${IC.plus()}정류장 추가</div>
          <div class="sec">배차</div>
          ${sliders()}
          ${kv('차량','1편성')}
          <div class="sec">운행 정보</div>
          ${stats()}
          ${need()}
        </div>
      </div>
    </div>
  </div>`);
  put(`<div class="tag" style="left:1116px;top:14px"><b>1-A</b>예시 값</div>`);
}
if (SCN === 1 && VAR === 'B'){
  put(`<div class="win B">
    <div class="hd"><span class="ttl">노선</span><span class="btn" style="height:40px">${IC.plus()}새 노선</span><span class="ib">${IC.x(20)}</span></div>
    <div class="kt">${tabs()}</div>
    <div class="acc">
      <div class="grp">
        <div class="lr"><span class="nm">철도 1</span><span class="st">운행 중</span>${sw(true)}<span class="ib sm">${IC.trash}</span></div>
        ${stopRows()}
        <div class="btn wide focus" style="margin-top:7px;height:40px">${IC.plus()}정류장 추가</div>
        <div style="height:8px"></div>
        ${sliders()}
        ${kv('차량','1편성')}
        <div class="g2">${stats()}</div>
        ${need('g2')}
      </div>
      <div class="lr c"><span class="nm">철도 4</span><span class="st warn">${IC.warn}막힘</span>${sw(true)}</div>
    </div>
  </div>`);
  put(`<div class="tag" style="left:16px;top:14px"><b>1-B</b>예시 값</div>`);
}
if (SCN === 1 && VAR === 'C'){
  const X0 = 96, DX = 204;
  const node = (i, on) => `<div class="nd${on?' on':''}" style="left:${X0 + DX*i}px"><span class="num">${i+1}</span><span class="lb">기차역</span>` +
    (on ? `<span class="ops"><span class="ib sm">${IC.left}</span><span class="ib sm">${IC.right}</span><span class="ib sm">${IC.x(18)}</span></span>` : '') + `</div>`;
  put(`<div class="win C">
    <div class="nav">${tabs()}</div>
    <div class="list">
      <div class="lr c on"><span class="nm">철도 1</span><span class="st">운행 중</span></div>
      <div class="lr c"><span class="nm">철도 4</span><span class="st warn">${IC.warn}막힘</span></div>
      <div class="btn wide" style="margin-top:4px">${IC.plus()}새 노선</div>
    </div>
    <div class="mid">
      <div class="dt"><span class="nm">철도 1</span><span>운행</span>${sw(true)}<span class="ib">${IC.trash}</span></div>
      <div class="strip">
        <div class="ln" style="left:${X0}px;width:${DX*2}px"></div>
        <div class="dl" style="left:${X0 + DX*2 + 30}px;width:${DX - 60}px"></div>
        ${node(0,false)}${node(1,true)}${node(2,false)}
        <div class="nd focus" style="left:${X0 + DX*3}px"><span class="num add">${IC.plus()}</span><span class="lb">정류장 추가</span></div>
      </div>
    </div>
    <div class="side">
      ${sliders()}
      ${kv('차량','1편성')}
      <div class="g2">${stats()}</div>
      ${need('g2')}
    </div>
    <span class="ib xc">${IC.x(20)}</span>
  </div>`);
  put(`<div class="tag" style="left:16px;top:14px"><b>1-C</b>예시 값</div>`);
}
if (SCN === 2){
  const picked = n => `<div class="stop">${badge(n)}<span>기차역</span><span class="sp"></span><span class="ib sm">${IC.x(18)}</span></div>`;
  put(`<div class="win B">
    <div class="hd"><span class="ttl">노선</span><span class="ib">${IC.x(20)}</span></div>
    <div class="kt">${tabs(true)}</div>
    <div class="acc">
      <div class="grp">
        <div class="lr"><span class="nm">새 노선</span></div>
        ${picked(1)}${picked(2)}
        <div class="stop slot"><span class="num hol">3</span></div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <span class="btn pri focus" style="flex:1">완료</span><span class="btn" style="flex:1">취소</span>
        </div>
      </div>
      <div class="lr c"><span class="nm">철도 1</span><span class="st">운행 중</span>${sw(true)}</div>
      <div class="lr c"><span class="nm">철도 4</span><span class="st warn">${IC.warn}막힘</span>${sw(true)}</div>
    </div>
  </div>`);
  put(`<div class="tag" style="left:16px;top:14px"><b>2-B</b>예시 값</div>`);
}
})();
</script>
</body>
</html>
