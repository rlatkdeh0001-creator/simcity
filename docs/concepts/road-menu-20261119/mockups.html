<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>도로 메뉴 시안 (2026-11-19)</title>
<!--
  도로 메뉴 시안 — 일방통행 4종 · 중앙 고가·지하차도 3종 (2026-11-19)
  쿼리: ?s=1|2&v=A|B|C   (기본 s=1, v=A)
    s=1 메뉴 배치       A 두 줄 트레이 · B 종류 3단 토글 · C 차선 카드에서 펼침   (&sel=ow1..ow4|cf4|cf6|cf8|l2..l8 로 고른 카드 바꾸기)
    s=2 그릴 때 표시     A 끝 화살촉 하나 · B 차로 화살표 · C 흐르는 갈매기 무늬
    &m=A|B|C  s=2 화면의 트레이 배치(기본 B)   &still=1 움직임 끄기(캡처용)   &c=y|r 미리보기 색 노랑·빨강   &dbg=1 검사 값 출력
  배경: 실제 게임 캡처 artifacts/e2-underground-20261119/e2-ground-1920.png (배율 2.0). 이 파일 안에 들어 있다.
  지도 좌표(m) → 화면: x = 429.5 + 7(X−Y), y = 124.25 + 3.5(X+Y) − 8.573·Z
  실제 Godot 화면이 아니라 시안이다. 새 썸네일 7장과 지도 위 새 도로는 시안용 그림이다.
-->
<style>

:root{--panel:#142b37;--tray:#142e3c;--line:#38515e;--ink:#edf4f5;--accent:#36b7ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:"Open Sans","Segoe UI","Malgun Gothic","맑은 고딕","Noto Sans KR",sans-serif;font-weight:600;color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
#bg{position:absolute;left:0;top:0;width:1920px;height:1080px}
svg.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
#ui>div{position:absolute}
/* 시안 표시(게임 화면에는 없다): 점선 테두리 */
.tag,.note{padding:5px 12px;border:1px dashed rgba(237,244,245,.75);border-radius:6px;background:rgba(20,43,55,.86);font-size:18px;line-height:24px;white-space:nowrap}
.tag b{color:var(--accent);margin-right:8px}
/* 하단 도로 트레이 — 치수는 캡처에서 잰 값 */
.tray{background:var(--tray);border:1px solid var(--line);border-radius:7px}
.shelf{background:var(--tray);border:1px solid var(--line);border-bottom:0;border-radius:7px 7px 0 0}
.hd{font-size:22px;line-height:30px;white-space:nowrap}
.card{width:96px;height:84px;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:#7e9275}
.card.on{border-color:var(--accent)}
.card.open{box-shadow:0 -4px 0 0 var(--accent)}
.card img,.card svg.th{position:absolute;left:0;top:0;width:92px;height:80px;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:0;height:28px;background:rgba(19,29,31,.9);color:#fff;font-size:18px;line-height:27px;text-align:center;white-space:nowrap;overflow:hidden}
.card .more{position:absolute;right:3px;top:3px;width:16px;height:16px;line-height:0}
.vrule{background:var(--line)}
.kbtn{width:136px;height:30px;border-radius:4px;background:var(--panel);font-size:18px;line-height:30px;text-align:center;white-space:nowrap}
.kbtn.on{background:var(--accent);color:#fff;border-bottom:3px solid var(--ink);line-height:27px}
.hbtn{width:88px;height:38px;border-radius:4px;background:var(--panel);font-size:20px;line-height:38px;text-align:center;white-space:nowrap}
.hbtn.on{background:var(--accent);color:#fff;border-bottom:3px solid var(--ink);line-height:35px}
.sbtn{width:52px;height:36px;border-radius:5px;background:#152831;font-size:22px;line-height:34px;text-align:center}
.sbtn.off{color:#6f7b82}
.hval{width:172px;height:36px;font-size:22px;line-height:36px;text-align:center;color:#fff;white-space:nowrap}
.grid{width:58px;height:100px;border-radius:7px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.xbtn{width:43px;height:100px;border-radius:7px;background:#152d3b;border:1px solid #20394a;display:flex;align-items:center;justify-content:center;padding-top:12px}
.patch{background:#7e9275}
.modes{width:154px;height:54px;background-repeat:no-repeat;background-size:1920px 1080px;background-position:-17px -681px}
/* 지도 위 표시 */
.measure{padding:2px 9px;border-radius:6px;background:rgba(20,43,55,.9);font-size:18px;line-height:24px;white-space:nowrap;transform:translate(-50%,-50%)}
.cur{width:26px;height:34px}
#rmDbg{position:absolute;left:0;top:1090px;font-size:12px}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <svg id="ground" class="layer" xmlns="http://www.w3.org/2000/svg"><defs id="defs"></defs></svg>
  <div id="ui"></div>
</div>
<script>
function rmBoot(RM_IMG){
'use strict';
const Q = new URLSearchParams(location.search);
const SCN = Q.get('s') === '2' ? 2 : 1;
function opt(key, def){ const v = (Q.get(key) || def).toUpperCase(); return ['A','B','C'].indexOf(v) >= 0 ? v : def; }
const VAR = opt('v', 'A');
const MENU = SCN === 1 ? VAR : opt('m', 'B');
const STILL = Q.get('still') === '1';
document.title = '도로 메뉴 시안 ' + SCN + '-' + VAR;
const NS = 'http://www.w3.org/2000/svg';
const ui = document.getElementById('ui'), gnd = document.getElementById('ground'), defs = document.getElementById('defs');
document.getElementById('bg').src = RM_IMG.bg;

/* ───────── 그리기 도우미 ───────── */
function el(par, tag, attrs, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  par.appendChild(e); return e;
}
function box(cls, x, y, html, w, h){
  const e = document.createElement('div');
  e.className = cls; e.style.left = x + 'px'; e.style.top = y + 'px';
  if (w != null) e.style.width = w + 'px';
  if (h != null) e.style.height = h + 'px';
  e.innerHTML = html || ''; ui.appendChild(e); return e;
}
/* 등각 투영: X → (k, k/2), Y → (−k, k/2), 높이 Z → (0, −k·√1.5) */
function proj(ox, oy, k){
  const kz = k * Math.sqrt(1.5);
  return { ox: ox, oy: oy, k: k, kz: kz, perM: k * Math.sqrt(1.25),
    pt: function(X, Y, Z){ return [ox + k * (X - Y), oy + k / 2 * (X + Y) - kz * (Z || 0)]; },
    mtx: function(){ return 'matrix(' + k + ' ' + k / 2 + ' ' + (-k) + ' ' + k / 2 + ' ' + ox + ' ' + oy + ')'; } };
}
/* 도로 기준 좌표: t = 진행 방향 거리(m), s = 진행 방향 오른쪽으로 벗어난 거리(m) */
function frame(pr, sx, sy, dx, dy){
  const nx = -dy, ny = dx;
  return { pr: pr, sx: sx, sy: sy, dx: dx, dy: dy,
    w: function(t, s){ return [sx + dx * t + nx * s, sy + dy * t + ny * s]; },
    at: function(t, s, z){ const p = this.w(t, s); return pr.pt(p[0], p[1], z); } };
}
function sub(f, t, s, dir){ const p = f.w(t, s); return frame(f.pr, p[0], p[1], f.dx * dir, f.dy * dir); }
function poly(g, pts, fill, more){
  const a = {points: pts.map(function(p){ return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join(' '), fill: fill};
  if (fill.charAt(0) === '#'){ a.stroke = fill; a['stroke-width'] = 0.7; a['stroke-linejoin'] = 'round'; }
  return el(g, 'polygon', Object.assign(a, more || {}));
}
function mark(g, f, pts, color, wpx, dash, more){
  const a = {d: 'M' + pts.map(function(p){ const q = f.at(p[0], p[1], p[2] || 0); return q[0].toFixed(2) + ' ' + q[1].toFixed(2); }).join(' L'),
             fill: 'none', stroke: color, 'stroke-width': wpx};
  if (dash) a['stroke-dasharray'] = dash.map(function(m){ return (m * f.pr.perM).toFixed(2); }).join(' ');
  return el(g, 'path', Object.assign(a, more || {}));
}
/* 지도 좌표에서 폭 w 인 띠. cap='start' 면 시작 쪽만 둥근 끝(게임의 막힌 도로 끝) */
function ribbon(g, f, t0, t1, sc, w, color, cap){
  const gg = el(g, 'g', {transform: f.pr.mtx()});
  const a = f.w(t0, sc), b = f.w(t1, sc), c = f.w(t0 + 0.02, sc);
  el(gg, 'line', {x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: color, 'stroke-width': w, 'stroke-linecap': cap === 'round' ? 'round' : 'butt'});
  if (cap === 'start') el(gg, 'line', {x1: a[0], y1: a[1], x2: c[0], y2: c[1], stroke: color, 'stroke-width': w, 'stroke-linecap': 'round'});
  return gg;
}
function arrowPts(f, t, s, len, hw){
  const sh = hw * 0.25, hb = len * 0.55;
  return [[t, s - sh], [t + hb, s - sh], [t + hb, s - hw], [t + len, s], [t + hb, s + hw], [t + hb, s + sh], [t, s + sh]].map(function(p){ return f.at(p[0], p[1], 0); });
}

/* ───────── 도로 단면 (ROAD_DRAWING_KO '일방통행 도로' · '중앙 고가차도') ───────── */
const GAME  = {walk:'#c8cbc3', road:'#4c5659', line:'#e8e7dc', mid:'#e4bd5f', lw:2.6, mw:3, wall:'#b0b5ab', bface:'#bec1b8', capc:'#ced0c7'};
const THUMB = {walk:'#f3fbf6', road:'#616e74', line:'#ffffff', mid:'#ffea7b', lw:2.8, mw:3.2, wall:'#a7b1ad', bface:'#d2dbd6', capc:'#f3fbf6'};
const OW = {
  1:   {W:6,  asph:[-3, 2.25],      solid:[0.5],       dash:[],             lanes:[-1.25],                     curb:2.25},
  2:   {W:12, asph:[-5.25, 5.25],   solid:[-3.5, 3.5], dash:[0],            lanes:[-1.75, 1.75],               curb:5.25},
  3:   {W:12, asph:[-5.25, 5.25],   solid:[],          dash:[-1.75, 1.75],  lanes:[-3.5, 0, 3.5],              curb:5.25},
  4:   {W:20, asph:[-8.75, 8.75],   solid:[-7, 7],     dash:[-3.5, 0, 3.5], lanes:[-5.25, -1.75, 1.75, 5.25],  curb:8.75},
  n2:  {W:8,  asph:[-4, 3],         solid:[],          dash:[-0.5],         lanes:[-2.25, 1.25],               curb:3}
};
const CEN = {
  4: {W:20, walk:1.25, sh:7,    dashes:[3.5],          side:1,    deck:'median'},
  6: {W:28, walk:1.75, sh:10.5, dashes:[3.5, 7],       side:1,    deck:'barrier'},
  8: {W:32, walk:2.0,  sh:0,    dashes:[3.5, 7, 10.5], side:'n2', deck:'barrier'}
};
/* 일방통행 도로(보통·분기 공용). o.yellow = 분기 편도 도로의 노란 실선(연석 바로 안쪽) */
function oneWay(g, f, t0, t1, n, c, o){
  o = o || {}; const p = OW[n];
  const ex = o.cap ? 0 : 0.4;   /* 이음매 가림: 차도 띠를 조금 길게 */
  ribbon(g, f, t0, t1, 0, p.W, c.walk, o.cap);
  ribbon(g, f, t0 - ex, t1 + ex, (p.asph[0] + p.asph[1]) / 2, p.asph[1] - p.asph[0], c.road, o.cap);
  p.solid.forEach(function(s){ mark(g, f, [[t0, s], [t1, s]], c.line, c.lw); });
  p.dash.forEach(function(s){ mark(g, f, [[t0, s], [t1, s]], c.line, c.lw, [3, 2]); });
  if (o.yellow) mark(g, f, [[t0, p.curb - 0.3], [t1, p.curb - 0.3]], c.mid, c.mw);
  (o.arrows || []).forEach(function(t){ p.lanes.forEach(function(s){ poly(g, arrowPts(f, t, s, o.alen || 6, o.ahw || 0.95), c.line); }); });
}
/* 중앙 고가: 보통 도로 → 옮김 구간 → 분기(양옆 분기 편도 도로 2개 + 가운데 경사로) */
function central(g, f, o){
  const q = CEN[o.lanes], c = o.c, hw = q.W / 2, ah = hw - q.walk, sd = OW[q.side];
  const cw = hw - sd.W, ah2 = hw - (sd.W / 2 - sd.curb), tT = o.taper, tS = o.split, tE = o.end, wi = cw - 0.5;
  const near = (f.w(0, 1)[0] + f.w(0, 1)[1]) > (f.w(0, 0)[0] + f.w(0, 0)[1]) ? 1 : -1;
  ribbon(g, f, o.t0, tT + 0.1, 0, q.W, c.walk, o.cap);
  ribbon(g, f, o.t0, tT + 0.1, 0, 2 * ah, c.road, o.cap);
  poly(g, [f.at(tT, -hw), f.at(tS + 0.1, -hw), f.at(tS + 0.1, hw), f.at(tT, hw)], c.walk);
  poly(g, [f.at(tT - 0.6, -ah), f.at(tT, -ah), f.at(tS + 0.1, -ah2), f.at(tS + 0.1, ah2), f.at(tT, ah), f.at(tT - 0.6, ah)], c.road);
  poly(g, [f.at(tS, -cw), f.at(tE, -cw), f.at(tE, cw), f.at(tS, cw)], c.road);
  oneWay(g, sub(f, tE, -(cw + sd.W / 2), -1), 0, tE - tS, q.side, c, {yellow: o.yellow, arrows: o.arrowsL});
  oneWay(g, sub(f, tS, cw + sd.W / 2, 1), 0, tE - tS, q.side, c, {yellow: o.yellow, arrows: o.arrowsR});
  [-1, 1].forEach(function(sg){
    if (q.sh) mark(g, f, [[o.t0, sg * q.sh], [tT, sg * q.sh], [tS, sg * (cw + sd.W / 2 + sd.solid[sd.solid.length - 1])]], c.line, c.lw);
    q.dashes.forEach(function(d){ mark(g, f, [[o.t0, sg * d], [tS, sg * d]], c.line, c.lw, [3, 2]); });
  });
  mark(g, f, [[o.t0, 0], [tS, 0]], c.mid, c.mw);
  /* 가운데 구조물: 먼 쪽 방호벽 → 상판 → 가까운 쪽 옹벽·방호벽 */
  function z(t){ return o.grade * (t - tS); }
  function bh(t){ return Math.min(1.1, (t - tS) * 0.275); }
  const segs = [[tS, Math.min(tS + 4, tE)], [Math.min(tS + 4, tE), tE]];
  segs.forEach(function(sgm){ const a = sgm[0], b = sgm[1]; if (b <= a) return;
    poly(g, [f.at(a, -near * wi, z(a)), f.at(b, -near * wi, z(b)), f.at(b, -near * wi, z(b) + bh(b)), f.at(a, -near * wi, z(a) + bh(a))], c.bface);
    poly(g, [f.at(a, -near * cw, z(a) + bh(a)), f.at(b, -near * cw, z(b) + bh(b)), f.at(b, -near * wi, z(b) + bh(b)), f.at(a, -near * wi, z(a) + bh(a))], c.capc);
  });
  poly(g, [f.at(tS, -wi, 0), f.at(tE, -wi, z(tE)), f.at(tE, wi, z(tE)), f.at(tS, wi, 0)], c.road);
  if (q.deck === 'median') mark(g, f, [[tS, 0, 0], [tE, 0, z(tE)]], c.mid, c.mw);
  else {
    mark(g, f, [[tS, 0, 0], [tE, 0, z(tE)]], c.capc, c.mw + 1.2);
    [-1, 1].forEach(function(sg){ mark(g, f, [[tS, sg * 3.75, 0], [tE, sg * 3.75, z(tE)]], c.line, c.lw, [3, 2]); });
  }
  segs.forEach(function(sgm){ const a = sgm[0], b = sgm[1]; if (b <= a) return;
    poly(g, [f.at(a, near * cw, 0), f.at(b, near * cw, 0), f.at(b, near * cw, z(b)), f.at(a, near * cw, z(a))], c.wall);
    poly(g, [f.at(a, near * cw, z(a)), f.at(b, near * cw, z(b)), f.at(b, near * cw, z(b) + bh(b)), f.at(a, near * cw, z(a) + bh(a))], c.bface);
    poly(g, [f.at(a, near * cw, z(a) + bh(a)), f.at(b, near * cw, z(b) + bh(b)), f.at(b, near * wi, z(b) + bh(b)), f.at(a, near * wi, z(a) + bh(a))], c.capc);
  });
}

/* ───────── 시안용 썸네일 (기존 local-N.png 와 같은 구도: 왼쪽 아래 → 오른쪽 위, 가운데 선 y = −0.5x + 135) ───────── */
function thumb(paint){
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('viewBox', '0 0 256 224'); s.setAttribute('class', 'th');
  el(s, 'rect', {x: 0, y: 0, width: 256, height: 224, fill: '#7e9275'});
  paint(s); return s;
}
function thOne(n){
  return thumb(function(s){
    const k = n === 4 ? 4.8 : 6.5, pr = proj(128, 71, k), f = frame(pr, 0, 128 / k + 6, 0, -1);
    oneWay(s, f, 0, 14 + 256 / k, n, THUMB, {arrows: [6 + 36 / k, 6 + 140 / k], alen: n === 4 ? 11 : 9, ahw: n >= 3 ? 1.05 : 1.25});
  });
}
function thCen(n){
  return thumb(function(s){
    const k = n === 4 ? 4.8 : 4, pr = proj(128, 84, k), f = frame(pr, 0, 128 / k + 6, 0, -1), sp = 6 + 74 / k;
    central(s, f, {lanes: n, t0: 0, taper: sp - 6, split: sp, end: 46 + 256 / k, grade: 0.2, c: THUMB, yellow: false});
  });
}
const TWO = [2, 3, 4, 5, 6, 7, 8].map(function(n){ return {id: 'l' + n, label: n + '차선', img: RM_IMG['l' + n]}; });
const ONE = [1, 2, 3, 4].map(function(n){ return {id: 'ow' + n, label: '편도 ' + n + '차로', paint: function(){ return thOne(n); }}; });
const MID = [4, 6, 8].map(function(n){ return {id: 'cf' + n, label: '중앙 ' + n + '차선', paint: function(){ return thCen(n); }}; });
const FAMILY = {l2: ['ow1', 'ow2'], l3: ['ow3'], l4: ['ow4', 'cf4'], l6: ['cf6'], l8: ['cf8']};   /* C: 폭이 같은 도로끼리 */
const byId = {}; TWO.concat(ONE, MID).forEach(function(it){ byId[it.id] = it; });

/* ───────── 하단 도로 트레이 ───────── */
const MORE_SVG = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 1.5H14.5V13Z" fill="#e4eef1" stroke="#152d3b" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const GRID_SVG = '<svg width="36" height="36" viewBox="0 0 36 36"><path d="M4 4H32V32H4Z M13.3 4V32 M22.7 4V32 M4 13.3H32 M4 22.7H32" fill="none" stroke="#142b37" stroke-width="3"/></svg>';
const CHEV_SVG = '<svg width="14" height="9" viewBox="0 0 14 9"><path d="M2 2L7 7L12 2" fill="none" stroke="#d1dce0" stroke-width="2"/></svg>';
function card(it, x, y, o){
  o = o || {};
  const e = box('card' + (o.on ? ' on' : '') + (o.open ? ' open' : ''), x, y, '');
  if (it.img){ const im = document.createElement('img'); im.src = it.img; im.alt = ''; e.appendChild(im); }
  else e.appendChild(it.paint());
  const nm = document.createElement('div'); nm.className = 'nm'; nm.innerHTML = '<span>' + it.label + '</span>'; e.appendChild(nm);
  if (o.more){ const m = document.createElement('div'); m.className = 'more'; m.innerHTML = MORE_SVG; e.appendChild(m); }
  e.dataset.k = 'card-' + it.id; return e;
}
function heightCtl(h, fixed){
  const x = 1392, lab = h === 0 ? '0 m' : (h > 0 ? '+' + h + ' m' : '−' + (-h) + ' m'), off = (h === 0 || fixed) ? ' off' : '';
  box('hbtn' + (h < 0 ? ' on' : ''), x, 760, '<span>지하</span>');
  box('hbtn' + (h === 0 ? ' on' : ''), x + 92, 760, '<span>지상</span>');
  box('hbtn' + (h > 0 ? ' on' : ''), x + 184, 760, '<span>고가</span>');
  box('sbtn' + off, x, 802, '−'); box('hval', x + 52, 802, '<span>' + lab + '</span>'); box('sbtn' + off, x + 224, 802, '+');
}
function moveModes(dy){   /* 그리기 방식 버튼(직선·곡선·자유 곡선)은 트레이 위에 붙어 있어 함께 올라간다 */
  box('patch', 13, 677, '', 162, 62);
  const m = box('modes', 17, 681 - dy, ''); m.style.backgroundImage = 'url(' + RM_IMG.bg + ')'; m.dataset.k = 'modes';
}
function tray(sel, h){
  const CX = 199, CY = 760, STEP = 104, kind = sel.slice(0, 2) === 'ow' ? 'one' : (sel.slice(0, 2) === 'cf' ? 'mid' : 'two');
  if (MENU === 'A'){            /* 두 줄: 새 7장을 윗줄에, 지금 7장은 제자리 */
    moveModes(92);
    box('tray', 115, 658, '', 1690, 214).dataset.k = 'tray'; box('hd', 136, 667, '<span>도로</span>');
    ONE.forEach(function(it, i){ card(it, CX + STEP * i, 668, {on: it.id === sel}); });
    box('vrule', 618, 676, '', 2, 68);
    MID.forEach(function(it, i){ card(it, CX + STEP * 4 + 16 + STEP * i, 668, {on: it.id === sel}); });
    TWO.forEach(function(it, i){ card(it, CX + STEP * i, CY, {on: it.id === sel}); });
  } else if (MENU === 'B'){     /* 종류 3단 토글 + 그 종류의 카드 */
    box('tray', 115, 750, '', 1690, 122).dataset.k = 'tray'; box('hd', 136, 759, '<span>도로</span>');
    [['two', '양방향'], ['one', '일방통행'], ['mid', '중앙 고가·지하']].forEach(function(kd, i){
      box('kbtn' + (kd[0] === kind ? ' on' : ''), CX, 761 + 34 * i, '<span>' + kd[1] + '</span>').dataset.k = 'kind-' + kd[0];
    });
    (kind === 'one' ? ONE : (kind === 'mid' ? MID : TWO)).forEach(function(it, i){ card(it, 347 + STEP * i, CY, {on: it.id === sel}); });
  } else {                      /* 같은 폭끼리 펼침: 차선 카드 위에 붙는 칸 */
    box('tray', 115, 750, '', 1690, 122).dataset.k = 'tray'; box('hd', 136, 759, '<span>도로</span>');
    let fam = null; for (const key in FAMILY) if (FAMILY[key].indexOf(sel) >= 0) fam = key;
    TWO.forEach(function(it, i){ card(it, CX + STEP * i, CY, {on: it.id === sel, open: it.id === fam, more: !!FAMILY[it.id]}); });
    if (fam){
      const ids = FAMILY[fam], w = ids.length * 96 + (ids.length - 1) * 8 + 20;
      const mid = CX + STEP * TWO.findIndex(function(it){ return it.id === fam; }) + 48, sx = Math.max(178, Math.round(mid - w / 2));
      box('shelf', sx, 647, '', w, 104).dataset.k = 'shelf';
      ids.forEach(function(id, i){ card(byId[id], sx + 10 + STEP * i, 657, {on: id === sel}); });
    }
  }
  heightCtl(h, kind === 'mid');
  box('grid', 1677, 761, GRID_SVG); box('xbtn', 1745, 761, CHEV_SVG);
}
function cursor(x, y){
  box('cur', x - 1, y - 1, '<svg width="26" height="34" viewBox="0 0 26 34"><path d="M1.5 1.5L1.5 26L8 20L12.3 30.5L16.6 28.7L12.4 18.6L21 18.6Z" fill="#ffffff" stroke="#111" stroke-width="2" stroke-linejoin="round"/></svg>');
}
function note(x, y, text, tx, ty, lx){   /* 시안 설명(점선) + 가리킴 선 */
  const n = box('note', x, y, '<span>' + text + '</span>'); n.dataset.k = 'note-' + text;
  el(gnd, 'line', {x1: lx, y1: ty < y ? y : y + 35, x2: tx, y2: ty, stroke: 'rgba(237,244,245,.95)', 'stroke-width': 1.6, 'stroke-dasharray': '5 4'});
  el(gnd, 'circle', {cx: tx, cy: ty, r: 4, fill: '#edf4f5', stroke: '#142b37', 'stroke-width': 1.5});
}
box('tag', 16, 14, '<b>' + SCN + '-' + VAR + '</b><span>시안 · 실제 게임 화면 아님' + (SCN === 2 ? ' · 점선 글자는 설명용' : '') + '</span>');

/* ───────── 장면 1: 메뉴 배치 — 중앙 4차선을 고르고 고가(+10 m)로 둔 상태 ───────── */
if (SCN === 1){
  const pick = byId[Q.get('sel')] ? Q.get('sel') : 'cf4';
  tray(pick, pick.slice(0, 2) === 'cf' ? 10 : 0);
}

/* ───────── 장면 2: 그릴 때 표시 — 편도 2차로를 왼쪽 위 2차선 도로에서 96 m 긋는 중 ───────── */
if (SCN === 2){
  const M = proj(429.5, 124.25, 7);
  /* (1) 보통 편도 1차로 6 m — 비교용 */
  oneWay(gnd, frame(M, 40, -36, 1, 0), 0, 150, 1, GAME, {cap: 'start'});
  /* (2) 4차선 20 m → 중앙 고가. 양옆이 분기 편도 도로(편도 1차로 6 m + 노란 실선), 가운데 8 m 가 7.8% 로 오른다 */
  const fa = frame(M, 48, -60, 1, 0);
  central(gnd, fa, {lanes: 4, t0: 0, taper: 38, split: 46, end: 132, grade: 10 / 128, c: GAME, yellow: true, cap: 'start'});
  /* (3) 그리는 중인 편도 2차로 12 m 미리보기 (초록 = 지을 수 있음) */
  const fp = frame(M, 0, 44, 1, 0), L = 96, HW = 6, GREEN = ({y: 'rgba(255,207,51,.58)', r: 'rgba(239,83,80,.58)'})[Q.get('c')] || 'rgba(76,208,125,.62)', EDGE = {stroke: 'rgba(16,32,42,.5)', 'stroke-width': 1, 'stroke-linejoin': 'round'};
  const E = fp.at(L, 0), A0 = fp.at(0, 0);
  if (VAR === 'B'){            /* B 차로마다 노면 화살표 */
    ribbon(gnd, fp, 0, L, 0, 2 * HW, GREEN, 'round');
    [12, 36, 60, 84].forEach(function(t){ [-1.75, 1.75].forEach(function(s){ poly(gnd, arrowPts(fp, t, s, 6, 0.95), 'rgba(255,255,255,.94)', EDGE); }); });
  } else if (VAR === 'C'){     /* C 띠 전체를 흐르는 갈매기 무늬 */
    const band = [];
    for (let i = 0; i <= 16; i++){ const a = -Math.PI / 2 + Math.PI * i / 16; band.push(fp.at(L + HW * Math.cos(a), HW * Math.sin(a))); }
    for (let i = 0; i <= 16; i++){ const a = Math.PI / 2 + Math.PI * i / 16; band.push(fp.at(HW * Math.cos(a), HW * Math.sin(a))); }
    poly(gnd, band, GREEN);
    poly(el(defs, 'clipPath', {id: 'rmBandClip'}), band, '#000');
    const flow = el(el(gnd, 'g', {'clip-path': 'url(#rmBandClip)'}), 'g', {});
    for (let t = -18; t < L + 12; t += 12)
      poly(flow, [[t, -4.6], [t + 6, 0], [t, 4.6], [t - 1.6, 4.6], [t + 4.4, 0], [t - 1.6, -4.6]].map(function(p){ return fp.at(p[0], p[1], 0); }), 'rgba(255,255,255,.82)', EDGE);
    if (!STILL && !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)){ const d = fp.at(12, 0); el(flow, 'animateTransform', {attributeName: 'transform', type: 'translate', from: '0 0', to: (d[0] - A0[0]) + ' ' + (d[1] - A0[1]), dur: '1.4s', repeatCount: 'indefinite'}); }
  } else {                     /* A 끝(커서)에 화살촉 하나 — 화면 크기 고정 */
    ribbon(gnd, fp, 0, L, 0, 2 * HW, GREEN, 'round');
    const ux = (E[0] - A0[0]) / Math.hypot(E[0] - A0[0], E[1] - A0[1]), uy = (E[1] - A0[1]) / Math.hypot(E[0] - A0[0], E[1] - A0[1]);
    const tx = E[0] - 30 * ux, ty = E[1] - 30 * uy, bx = tx - 46 * ux, by = ty - 46 * uy;
    el(gnd, 'line', {x1: A0[0], y1: A0[1], x2: bx + 10 * ux, y2: by + 10 * uy, stroke: 'rgba(255,255,255,.85)', 'stroke-width': 3});
    el(gnd, 'circle', {cx: A0[0], cy: A0[1], r: 9, fill: 'none', stroke: '#ffffff', 'stroke-width': 3});
    el(gnd, 'polygon', {points: [[tx, ty], [bx - 21 * uy, by + 21 * ux], [bx + 10 * ux, by + 10 * uy], [bx + 21 * uy, by - 21 * ux]].map(function(p){ return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '),
      fill: '#ffffff', stroke: '#10202a', 'stroke-width': 2, 'stroke-linejoin': 'round'});
  }
  const mid = fp.at(L / 2, 0);
  box('measure', mid[0], mid[1], '<span>' + L + ' m</span>');
  /* 시안 설명 */
  const yl = fa.at(52, -8.95), ow = M.pt(64, -36);
  note(1580, 160, '분기 편도 도로 · 노란 실선', yl[0], yl[1], yl[0]);
  note(1076, 286, '편도 1차로', ow[0], ow[1], ow[0]);
  tray('ow2', 0);
  cursor(E[0], E[1]);
}

/* ───────── 검사 값 (&dbg=1) ───────── */
if (Q.get('dbg') === '1'){
  const rep = {scn: SCN, v: VAR, menu: MENU, cards: ui.querySelectorAll('.card').length, shapes: gnd.querySelectorAll('polygon,path,line,circle').length, anim: gnd.querySelectorAll('animateTransform').length, small: [], tight: [], rects: {}};
  ui.querySelectorAll('div,span,b').forEach(function(e){
    let own = false; e.childNodes.forEach(function(n){ if (n.nodeType === 3 && n.textContent.trim()) own = true; });
    if (!own) return;
    const fs = parseFloat(getComputedStyle(e).fontSize); if (fs < 18) rep.small.push(e.className + ':' + fs);
  });
  ui.querySelectorAll('.nm,.kbtn,.hbtn,.hval').forEach(function(e){
    const s = e.querySelector('span'); if (!s) return;
    const sw = s.getBoundingClientRect().width; rep.tight.push([s.textContent, Math.round(sw * 10) / 10, e.clientWidth]);
  });
  ui.querySelectorAll('[data-k]').forEach(function(e){ const b = e.getBoundingClientRect(); rep.rects[e.dataset.k] = [Math.round(b.left), Math.round(b.top), Math.round(b.width), Math.round(b.height)]; });
  const pre = document.createElement('pre'); pre.id = 'rmDbg'; pre.textContent = JSON.stringify(rep); document.body.appendChild(pre);
}
}
</script>
