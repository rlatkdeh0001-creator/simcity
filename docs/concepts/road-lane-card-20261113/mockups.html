<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
body{margin:0;padding:6px 0}.row{display:flex;gap:22px;flex-wrap:wrap}
.o{width:250px}.t{font-size:18px;font-weight:700;margin:0 0 6px}.t span{font-weight:400;font-size:15px;color:var(--muted-foreground,#666);display:block}
.cards{display:flex;gap:6px;background:#142b37;padding:8px;border-radius:8px;width:max-content}
.card{width:76px;height:84px;border-radius:6px;overflow:hidden;position:relative}
.card svg{width:76px;height:84px;display:block}
.nm{position:absolute;left:0;right:0;bottom:0;background:rgba(20,43,55,.88);color:#edf4f5;font-size:15px;text-align:center;line-height:22px}
.big{margin-top:8px}.big svg{width:200px;height:220px;border-radius:8px;display:block}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<!-- shared: grass bg -->
<linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc48f"/><stop offset="1" stop-color="#7fae76"/></linearGradient>
<!-- A: diagonal road corner to corner, 2 lanes -->
<g id="A2"><rect width="200" height="220" fill="url(#gr)"/>
 <polygon points="-40,150 150,-40 230,40 40,230" fill="#c9cdcf"/>
 <polygon points="-25,160 160,-25 215,30 30,215" fill="#4d5357"/>
 <line x1="-5" y1="185" x2="190" y2="-10" stroke="#f2c14e" stroke-width="4"/></g>
<!-- B: shorter diagonal piece in center, grass + sidewalk + a tree -->
<g id="B2"><rect width="200" height="220" fill="url(#gr)"/>
 <polygon points="20,175 125,70 185,130 80,235" fill="#c9cdcf"/>
 <polygon points="30,180 125,85 172,132 77,227" fill="#4d5357"/>
 <line x1="54" y1="204" x2="149" y2="109" stroke="#f2c14e" stroke-width="4"/>
 <circle cx="45" cy="70" r="20" fill="#5f8f55"/><circle cx="160" cy="40" r="14" fill="#5f8f55"/></g>
<!-- C: diagonal road + zoning grid on grass both sides -->
<g id="C2"><rect width="200" height="220" fill="url(#gr)"/>
 <g stroke="rgba(255,255,255,.45)" stroke-width="1.5">
  <line x1="0" y1="80" x2="80" y2="0"/><line x1="0" y1="50" x2="50" y2="0"/><line x1="0" y1="20" x2="20" y2="0"/>
  <line x1="120" y1="220" x2="200" y2="140"/><line x1="150" y1="220" x2="200" y2="170"/><line x1="180" y1="220" x2="200" y2="200"/>
  <line x1="20" y1="60" x2="60" y2="100"/><line x1="140" y1="120" x2="180" y2="160"/></g>
 <polygon points="-40,150 150,-40 230,40 40,230" fill="#c9cdcf"/>
 <polygon points="-25,160 160,-25 215,30 30,215" fill="#4d5357"/>
 <line x1="-5" y1="185" x2="190" y2="-10" stroke="#f2c14e" stroke-width="4"/></g>
</defs></svg>

<div class="row">
<div class="o"><p class="t">A<span>카드 모서리→모서리 대각선, 양옆 풀밭</span></p>
 <div class="big"><svg viewBox="0 0 200 220"><use href="#A2"/></svg></div></div>
<div class="o"><p class="t">B<span>짧은 대각선 조각 + 풀밭·나무 (작은 장면)</span></p>
 <div class="big"><svg viewBox="0 0 200 220"><use href="#B2"/></svg></div></div>
<div class="o"><p class="t">C<span>A + 양옆 풀밭에 구획 격자선</span></p>
 <div class="big"><svg viewBox="0 0 200 220"><use href="#C2"/></svg></div></div>
</div>
<p style="font-size:15px;color:var(--muted-foreground,#666);margin:10px 0 4px">하단바에서 실제 크기 (A안 예시, 차로 수만큼 폭·차선 증가)</p>
<div class="cards">
 <div class="card"><svg viewBox="0 0 200 220"><use href="#A2"/></svg><div class="nm">2차선</div></div>
 <div class="card"><svg viewBox="0 0 200 220"><use href="#A2"/></svg><div class="nm">3차선</div></div>
 <div class="card"><svg viewBox="0 0 200 220"><use href="#A2"/></svg><div class="nm">4차선</div></div>
 <div class="card"><svg viewBox="0 0 200 220"><use href="#A2"/></svg><div class="nm">5차선</div></div>
 <div class="card"><svg viewBox="0 0 200 220"><use href="#A2"/></svg><div class="nm">8차선</div></div>
</div>
<p style="font-size:15px;color:var(--muted-foreground,#666);margin:8px 0 0">시안은 구도 설명용 그림. 실제 카드는 게임 도로를 이 구도로 Godot 렌더.</p>
</body></html>
