<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>CITIES_DO 지중 전력 흐름 시안</title>
<style>
:root{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;color:#e6eeec;background:#172d35}*{box-sizing:border-box}body{margin:0}header{padding:22px 28px;border-bottom:1px solid #425960;display:flex;align-items:baseline;gap:22px}h1{margin:0;font-size:26px}header span{color:#a9c4ca;font-size:14px}main{display:grid;grid-template-columns:280px 1fr;min-height:690px}aside{padding:28px 22px;background:#1c343e}h2{font-size:21px;margin:0 0 22px}.control{display:grid;gap:9px;margin-bottom:24px}button{font:inherit;font-size:16px;text-align:left;background:#284650;color:#dae8e7;border:1px solid #51707a;padding:12px 16px;cursor:pointer}button[aria-pressed=true]{background:#125c87;border-color:#54c2ff;color:white}button:focus-visible{outline:3px solid white;outline-offset:3px}dl{margin:25px 0}dt{color:#a9c4ca;font-size:14px;margin-top:18px}dd{margin:4px 0;font-size:26px;font-weight:700}.hint{line-height:1.9;font-size:14px;color:#bacdce}.white{display:inline-block;border-radius:50%;width:9px;height:9px;background:white;margin-right:8px}.blue{display:inline-block;border-radius:50%;width:9px;height:9px;background:#2baeff;margin-right:8px}section{min-width:0;background:#8a9d7d}svg{width:100%;display:block}#status{font-weight:600;font-size:19px;padding:18px 24px;background:#203b43}footer{padding:15px 28px;color:#b0c7c8;font-size:13px;border-top:1px solid #425960}text{font-family:inherit;fill:#173c47;font-weight:600}input{accent-color:#35b8ff}label{font-size:14px} @media(max-width:700px){header{padding:16px;display:block}h1{font-size:20px}main{display:flex;flex-direction:column}aside{padding:16px}.control{grid-template-columns:1fr 1fr;margin-bottom:12px}dl{display:flex;gap:28px;margin:12px 0}dt{margin:0}dd{font-size:21px}.hint{margin:8px 0}svg{min-height:360px}footer{line-height:1.8;padding:14px 16px}}
</style><header><h1>CITIES_DO · 지중 전력 흐름</h1><span>애니메이션 시안 · 게임 미적용</span></header><main><aside><h2>전력 탭</h2><div class="control"><button id="domestic" aria-pressed="true">내부 공급</button><button id="export" aria-pressed="false">잉여 전력 수출</button><button id="import" aria-pressed="false">부족 전력 수입</button><button id="pause" aria-pressed="false">일시정지</button></div><dl><div><dt>공급 반경</dt><dd>64m</dd></div><div><dt>지중 점 간격</dt><dd>32m</dd></div></dl><p class="hint"><span class="blue"></span>건설한 지중 전력선·접속점<br><span class="white"></span>간헐적으로 이동하는 흐름 표시</p><label><input id="coverage" type="checkbox" checked> 공급 범위 표시</label><p class="hint">깊이 지정 없이 건설<br>다른 시설과 중첩 가능<br>별도 종단 시설 불필요</p></aside><section><div id="status" role="status">내부 공급 · 하얀 원이 말단에서 사라집니다</div><svg id="map" viewBox="0 0 1000 650" role="img" aria-label="반경 64m, 32m 간격의 지중 전력망과 이동하는 하얀 원"><defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.5"/></filter></defs><g id="terrain"></g><g id="structures"></g><g id="ranges"></g><g id="wires"></g><g id="nodes"></g><g id="dimensions"></g><g id="pulses"></g><g id="labels"></g></svg></section></main><footer>1칸 = 4m · 공급 반경 16칸 / 점 간격 8칸 · 하얀 원은 방향 표시이며 실제 전기 이동 속도나 거래량을 나타내지 않습니다.</footer>
<script>
const NS='http://www.w3.org/2000/svg',P=([x,y])=>[350+(x-y)*.9,70+(x+y)*.45];
function el(tag,attrs,parent){const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);if(parent)parent.appendChild(n);return n}
const groups=Object.fromEntries(['terrain','structures','ranges','wires','nodes','dimensions','pulses','labels'].map(id=>[id,document.getElementById(id)]));
function polygon(pts,fill,parent=groups.terrain,extra={}){return el('polygon',{points:pts.map(P).map(p=>p.join(',')).join(' '),fill,...extra},parent)}
function line(points,color,width,parent=groups.wires,extra={}){return el('polyline',{points:points.map(P).map(p=>p.join(',')).join(' '),fill:'none',stroke:color,'stroke-width':width,'stroke-linecap':'round','stroke-linejoin':'round',...extra},parent)}
function label(point,text,dx=0,dy=0){const[x,y]=P(point);const n=el('text',{x:x+dx,y:y+dy,'font-size':16,'paint-order':'stroke',stroke:'#ecf0df','stroke-width':5,'stroke-linejoin':'round'},groups.labels);n.textContent=text;return n}
polygon([[0,0],[640,0],[640,384],[0,384]],'#95a789');
for(let x=0;x<=640;x+=32)line([[x,0],[x,384]],'#b3bfa6',.6,groups.terrain);
for(let y=0;y<=384;y+=32)line([[0,y],[640,y]],'#b3bfa6',.6,groups.terrain);
polygon([[0,144],[640,144],[640,160],[0,160]],'#c3c8bb');polygon([[0,147],[640,147],[640,157],[0,157]],'#4c5659');
polygon([[344,0],[360,0],[360,384],[344,384]],'#c3c8bb');polygon([[347,0],[357,0],[357,384],[347,384]],'#4c5659');
line([[0,152],[640,152]],'#dfc482',1,groups.terrain,{'stroke-dasharray':'9 8'});line([[352,0],[352,384]],'#dfc482',1,groups.terrain,{'stroke-dasharray':'9 8'});
function building(x,y,w,d,h,color,roof){const b=[[x,y],[x+w,y],[x+w,y+d],[x,y+d]].map(P),t=b.map(([px,py])=>[px,py-h]);function screenPoly(points,fill){return el('polygon',{points:points.map(p=>p.join(',')).join(' '),fill,stroke:'#60745e','stroke-width':.5},groups.structures)}screenPoly([b[1],b[2],t[2],t[1]],color);screenPoly([b[2],b[3],t[3],t[2]],'#c0bcaa');screenPoly(t,roof);return {b,t}}
const houses=[];for(const y of [64,112,240,304])for(const x of [112,176,240,416,480,544])houses.push([x,y]);houses.sort((a,b)=>a[0]+a[1]-b[0]-b[1]);
for(let i=0;i<houses.length;i++){const[x,y]=houses[i];building(x,y,22,20,16+(i%3)*5,['#ded6bc','#cfae91','#d1d9c8'][i%3],['#5a767a','#9e7460','#6d8183'][i%3]);}
building(32,176,32,38,25,'#d5dbce','#526c70');building(32,176,9,10,43,'#c5c9bf','#657b79');
const source=[64,192],junction=[256,192],endA=[256,64],endB=[448,320],port=[640,192];
const routes={domestic:[{id:'home-a',points:[source,junction,endA]},{id:'home-b',points:[source,junction,[448,192],endB]}],export:[{id:'home-a',points:[source,junction,endA]},{id:'home-b',points:[source,junction,[448,192],endB]},{id:'neighbor',points:[source,port]}],import:[{id:'import-a',points:[port,junction,endA]},{id:'import-b',points:[port,[448,192],endB]}]};
function routeLength(points){return points.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-points[i][0],p[1]-points[i][1]),0)}
function sample(points,distance){for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],len=Math.hypot(b[0]-a[0],b[1]-a[1]);if(distance<=len)return[a[0]+(b[0]-a[0])*distance/len,a[1]+(b[1]-a[1])*distance/len];distance-=len}return points.at(-1)}
const edges=[[source,port],[junction,endA],[[448,192],endB]],nodeMap=new Map();for(const points of edges){line(points,'#1c6da0',8);line(points,'#36b7ff',3.5);const len=routeLength(points);for(let d=0;d<=len;d+=32){const p=sample(points,d);nodeMap.set(p.join(','),p)}}
function coverage(p,selected=false){const ring=Array.from({length:97},(_,i)=>[p[0]+64*Math.cos(i/96*Math.PI*2),p[1]+64*Math.sin(i/96*Math.PI*2)]);polygon(ring,'#3bbaff',groups.ranges,{'fill-opacity':selected?.10:.018,stroke:'#2baff2','stroke-width':selected?2:1,'stroke-opacity':selected?.9:.15,'stroke-dasharray':selected?'5 4':'none'})}
for(const p of nodeMap.values()){coverage(p,p[0]===192&&p[1]===192);const[x,y]=P(p);el('circle',{cx:x,cy:y,r:p===source?9:4.5,fill:'#249fef',stroke:'#bbebff','stroke-width':1},groups.nodes)}
const start=P(source);el('circle',{cx:start[0],cy:start[1],r:10,fill:'#168ff0',stroke:'white','stroke-width':2},groups.nodes);
line([[192,192],[256,192]],'#eaf8ff',1.7,groups.dimensions);label([213,192],'반경 64m',-5,40);
line([[128,192],[160,192]],'#eff9ff',2,groups.dimensions);for(const p of [[128,192],[160,192]]){const[x,y]=P(p);el('line',{x1:x,y1:y-5,x2:x,y2:y+5,stroke:'white','stroke-width':2},groups.dimensions)}label([141,192],'32m',-18,-12);
label([32,176],'발전소',-10,-60);label(endA,'말단 · 도착 후 소멸',-45,-35);label(endB,'말단 · 종단 시설 없음',-95,34);label(port,'옆 마을',12,-12);line([port,[672,192]],'#3bbaff',3,groups.labels,{'stroke-dasharray':'5 5'});
let mode='domestic',paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=performance.now(),manual=false;
function pulseStates(t,currentMode){const active=routes[currentMode],out=[];const period=1.5,speed=80;for(let i=Math.max(0,Math.floor(t/period)-10);i<=Math.floor(t/period);i++){const route=active[i%active.length],age=t-i*period,len=routeLength(route.points),life=len/speed;if(age<0||age>=life)continue;out.push({emission:i,route:route.id,point:sample(route.points,age*speed),opacity:Math.min(1,(life-age)/.25),age,life})}return out}
function render(t,currentMode=mode){mode=currentMode;groups.pulses.replaceChildren();for(const p of pulseStates(t,mode)){const[x,y]=P(p.point);el('circle',{cx:x,cy:y,r:5.5,fill:'white',opacity:p.opacity*.65,filter:'url(#glow)'},groups.pulses);el('circle',{cx:x,cy:y,r:3.3,fill:'white',opacity:p.opacity,'data-route':p.route},groups.pulses)}for(const id of ['domestic','export','import'])document.getElementById(id).setAttribute('aria-pressed',String(id===mode));document.getElementById('status').textContent={domestic:'내부 공급 · 하얀 원이 말단까지 이동한 뒤 사라집니다',export:'잉여 전력 수출 · 내부 공급과 함께 옆 마을로 이동합니다',import:'부족 전력 수입 · 옆 마을에서 들어와 공급 말단까지 이동합니다'}[mode];}
for(const id of ['domestic','export','import'])document.getElementById(id).onclick=()=>{mode=id;time=0;manual=false;render(time)};
function updatePause(){document.getElementById('pause').setAttribute('aria-pressed',String(paused));document.getElementById('pause').textContent=paused?'재생':'일시정지'}
document.getElementById('pause').onclick=()=>{paused=!paused;manual=false;updatePause()};updatePause();document.getElementById('coverage').onchange=e=>groups.ranges.style.display=e.target.checked?'':'none';
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused&&!manual){time+=dt;render(time)}requestAnimationFrame(frame)}render(0);requestAnimationFrame(frame);
window.preview={renderAt:(t,m)=>{manual=true;time=t;render(t,m)},pulseStates,routeLength,sample,routes,nodes:[...nodeMap.values()],radius:64,spacing:32,project:P,getMode:()=>mode,isPaused:()=>paused};
</script></html>
